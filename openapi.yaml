openapi: 3.0.3
info:
  title: API Gestor Documental - Escuela G-733 Chorombo Bajo
  description: >
    API REST para la gestion documental del equipo directivo de la Escuela Basica
    G-733 Chorombo Bajo (comuna de Maria Pinto). Permite crear, consultar, actualizar
    y eliminar registros documentales (memos, oficios, citaciones de apoderados,
    acuerdos de apoderados, reuniones comunales y permisos administrativos).
  version: "1.0.0"
  contact:
    name: Rodrigo Alexis Soto Cifuentes
    email: rodalsoto@gmail.com
servers:
  - url: http://localhost/chorombo-backend/public
    description: Servidor local XAMPP

tags:
  - name: Documentos
    description: Operaciones CRUD sobre registros documentales
  - name: Tipos de documento
    description: Catalogo de tipos documentales disponibles

paths:
  /api/documentos:
    get:
      tags: [Documentos]
      summary: Listar documentos
      description: Retorna un listado paginado de documentos, con filtro opcional por tipo.
      parameters:
        - name: tipo
          in: query
          description: Codigo del tipo de documento (ver /api/tipos-documento)
          required: false
          schema: { type: string, example: memo }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        "200":
          description: Listado obtenido exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoListResponse" }
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [Documentos]
      summary: Crear un nuevo documento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentoInput" }
            example:
              titulo: "Memo N 13 - Reunion de apoderados"
              tipo_documento_id: 1
              fecha: "2026-09-01"
              descripcion: "Convocatoria a reunion de apoderados de todos los cursos."
              archivo_referencia: "memo_013_2026.pdf"
      responses:
        "201":
          description: Documento creado exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoResponse" }
        "422":
          description: Datos de entrada invalidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/documentos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, example: 1 }
    get:
      tags: [Documentos]
      summary: Obtener un documento por ID
      responses:
        "200":
          description: Documento encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoResponse" }
        "400":
          description: ID invalido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Documento no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [Documentos]
      summary: Actualizar un documento completo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentoInput" }
      responses:
        "200":
          description: Documento actualizado exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoResponse" }
        "404":
          description: Documento no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Datos de entrada invalidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
    patch:
      tags: [Documentos]
      summary: Actualizar un documento de forma parcial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentoPatchInput" }
            example:
              descripcion: "Se reprograma la reunion para el 05 de septiembre."
      responses:
        "200":
          description: Documento actualizado exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoResponse" }
        "404":
          description: Documento no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Datos de entrada invalidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
    delete:
      tags: [Documentos]
      summary: Eliminar un documento
      responses:
        "200":
          description: Documento eliminado exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "404":
          description: Documento no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/tipos-documento:
    get:
      tags: [Tipos de documento]
      summary: Listar tipos de documento disponibles
      responses:
        "200":
          description: Catalogo obtenido exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TipoDocumentoListResponse" }

components:
  schemas:
    TipoDocumento:
      type: object
      properties:
        id: { type: integer, example: 1 }
        codigo: { type: string, example: memo }
        nombre: { type: string, example: Memo }

    Documento:
      type: object
      properties:
        id: { type: integer, example: 1 }
        titulo: { type: string, example: "Memo N 12 - Suspension de clases" }
        fecha: { type: string, format: date, example: "2026-08-10" }
        descripcion: { type: string, nullable: true }
        archivo_referencia: { type: string, nullable: true, example: "memo_012_2026.pdf" }
        tipo_documento:
          $ref: "#/components/schemas/TipoDocumento"
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }

    DocumentoInput:
      type: object
      required: [titulo, tipo_documento_id, fecha]
      properties:
        titulo: { type: string, maxLength: 200 }
        tipo_documento_id: { type: integer, example: 1 }
        fecha: { type: string, format: date }
        descripcion: { type: string, nullable: true }
        archivo_referencia: { type: string, nullable: true }

    DocumentoPatchInput:
      type: object
      description: Cualquier subconjunto de los campos de DocumentoInput.
      properties:
        titulo: { type: string, maxLength: 200 }
        tipo_documento_id: { type: integer }
        fecha: { type: string, format: date }
        descripcion: { type: string, nullable: true }
        archivo_referencia: { type: string, nullable: true }

    DocumentoResponse:
      type: object
      properties:
        lang: { type: string, example: esp }
        status: { type: string, example: success }
        code: { type: integer, example: 200 }
        message: { type: string }
        data: { $ref: "#/components/schemas/Documento" }

    DocumentoListResponse:
      type: object
      properties:
        lang: { type: string, example: esp }
        status: { type: string, example: success }
        code: { type: integer, example: 200 }
        total: { type: integer }
        meta:
          type: object
          properties:
            total: { type: integer }
            pagina: { type: integer }
            por_pagina: { type: integer }
            paginas: { type: integer }
        data:
          type: array
          items: { $ref: "#/components/schemas/Documento" }

    TipoDocumentoListResponse:
      type: object
      properties:
        lang: { type: string, example: esp }
        status: { type: string, example: success }
        code: { type: integer, example: 200 }
        total: { type: integer }
        data:
          type: array
          items: { $ref: "#/components/schemas/TipoDocumento" }

    MessageResponse:
      type: object
      properties:
        lang: { type: string, example: esp }
        status: { type: string, example: success }
        code: { type: integer, example: 200 }
        message: { type: string }

    ErrorResponse:
      type: object
      properties:
        lang: { type: string, example: esp }
        status: { type: string, example: error }
        code: { type: integer, example: 404 }
        message: { type: string }

    ValidationErrorResponse:
      type: object
      properties:
        lang: { type: string, example: esp }
        status: { type: string, example: error }
        code: { type: integer, example: 422 }
        message: { type: string }
        errors:
          type: array
          items: { type: string }
